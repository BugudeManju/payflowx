spring.application.name=payment-service


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/payflowx}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


spring.mvc.pathmatch.matching-strategy= ANT_PATH_MATCHER


spring.kafka.bootstrap-servers=localhost:9092

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.payflowx.*
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer


#Threshold for payment
fraud.suspicious-amount-threshold=10000

#Blocked email domains
blocked.email.domains=yahoo.com,reddit.com,yandex.com